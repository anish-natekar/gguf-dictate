[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gguf-dictate"
dynamic = ["version"]
description = "Local push-to-talk dictation and voice-annotated screenshot snips for Linux/X11, running any speech-to-text GGUF"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["evdev; sys_platform == 'linux'", "jeepney; sys_platform == 'linux'", "numpy", "platformdirs", "pynput", "PySide6-Essentials", "sounddevice", "transcribe-cpp"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "ruff"]

[project.urls]
Homepage = "https://github.com/anish-natekar/gguf-dictate"
Issues = "https://github.com/anish-natekar/gguf-dictate/issues"

[project.scripts]
dictate = "gguf_dictate.app:main"
dictate-tray = "gguf_dictate.app:main"

[tool.setuptools.dynamic]
version = { attr = "gguf_dictate.__version__" }

[tool.setuptools.packages.find]
include = ["gguf_dictate*"]

[tool.ruff]
line-length = 160
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E402", "SIM105", "UP015", "B023", "SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
